<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makro-Dashboard · Regime</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<header class="kopf">
  <div class="kopf-zeile">
    <div>
      <a class="kopf-zurueck" href="index.html">← Übersicht</a>
      <div class="kopf-pfad">Makro-Dashboard</div>
      <h1>Regime</h1>
    </div>
    <button id="themaSchalter" class="thema-schalter" type="button" aria-label="Hell- oder Dunkelmodus umschalten">
      <span class="thema-hell">Hell</span><span class="thema-dunkel">Dunkel</span>
    </button>
  </div>
  <p class="kopf-frage">In welchem Zinskurven-Regime befinden wir uns, deckt sich das kurzfristige Bild mit dem IPDA-Zyklus, und welche Assets performen erfahrungsgemäß in diesem Umfeld?</p>
</header>

<!-- Regime-Tafel: Charts, Tabelle, Regime-Kaesten, Nachschlage-Knoepfe.
     Wird von regime-ansicht.js aufgebaut. -->
<div id="regimeKopf"></div>

<!-- Kachel-Gruppen (Konjunkturzyklus-Fruehindikatoren) aus motor.js,
     darunter haengt regime-ansicht.js die Performance-Tabelle an. -->
<main id="kachelbereiche"></main>

<footer class="fuss">
  <span id="fussStand"></span>
  <span class="fuss-trenner">·</span>
  <span>Quellen: FRED (St. Louis Fed), Yahoo Finance</span>
</footer>

<!-- Detailansicht der Kacheln (motor.js) -->
<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitel">

    <div class="dialog-kopf">
      <div>
        <h2 id="detailTitel"></h2>
        <p class="dialog-unter" id="detailUnter"></p>
      </div>
      <button class="schliessen" id="schliessen" type="button" aria-label="Schließen">&times;</button>
    </div>

    <p class="prueffrage" id="detailFrage"></p>

    <div class="kennwerte" id="detailKennwerte"></div>

    <div class="steuerzeile" id="steuerzeile">
      <div class="zeitraum" id="zeitraum" role="group" aria-label="Zeitraum"></div>
      <button class="ansicht-schalter" id="ansichtSchalter" type="button">Tabelle anzeigen</button>
    </div>

    <figure class="graph-rahmen">
      <div class="graph-behaelter" id="graphBehaelter"></div>
      <figcaption id="graphLegende" class="legende"></figcaption>
    </figure>

    <div class="tabelle-behaelter" id="tabelleBehaelter" hidden></div>

    <section class="aufschluesselung" id="aufschluesselung" hidden></section>

    <div class="dialog-fuss">
      <div id="detailQuelle"></div>
      <div id="detailHinweis" class="hinweis"></div>
    </div>

  </div>
</div>

<!-- Vollbild fuer die drei Charts -->
<div class="overlay" id="vollbild" hidden>
  <div class="dialog dialog-breit" role="dialog" aria-modal="true" aria-labelledby="vollbildTitel">
    <div class="dialog-kopf">
      <div>
        <h2 id="vollbildTitel"></h2>
        <p class="dialog-unter" id="vollbildUnter"></p>
      </div>
      <button class="schliessen" id="vollbildSchliessen" type="button" aria-label="Schließen">&times;</button>
    </div>
    <div class="chart-box chart-vollbild" id="vollbildChart"></div>
  </div>
</div>

<!-- Nachschlage-Dialoge: Sharp Ratios, Core Setups, Info -->
<div class="overlay" id="nachschlag" hidden>
  <div class="dialog dialog-breit" role="dialog" aria-modal="true" aria-labelledby="nachschlagTitel">
    <div class="dialog-kopf">
      <div>
        <h2 id="nachschlagTitel"></h2>
        <p class="dialog-unter" id="nachschlagUnter"></p>
      </div>
      <button class="schliessen" id="nachschlagSchliessen" type="button" aria-label="Schließen">&times;</button>
    </div>
    <div class="nachschlag-inhalt" id="nachschlagInhalt"></div>
  </div>
</div>

<script src="daten/regime.js"></script>
<script src="bereiche/regime-kacheln.js"></script>
<script src="motor.js"></script>
<script src="regime-ansicht.js"></script>
</body>
</html>
