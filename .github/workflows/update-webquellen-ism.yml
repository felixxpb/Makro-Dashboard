name: Update ISM Sub-Indices (Web)

on:
  schedule:
    - cron: '0 6 5-10 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ISM-Sub-Indizes abrufen und aktualisieren
        run: node scripts/update-webquellen-ism.js
      - name: Änderungen committen
        run: |
          git config user.name "PMI-Update-Bot"
          git config user.email "actions@github.com"
          git add daten/webquellen.js
          git diff --staged --quiet || git commit -m "Auto-Update: ISM Sub-Indizes (Web)"
          git push
